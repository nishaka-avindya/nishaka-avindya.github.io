theme: jekyll-theme-primer

title: Nishaka Avindya
tagline: SEO Specialist in Sri Lanka
description: >-
  Nishaka Avindya is an SEO Specialist in Sri Lanka, working across
  technical SEO, on-page optimization, link building, and AI search
  visibility.

url: https://nishakaavindya.com
lang: en

author: Nishaka Avindya
twitter:
  username: nishaka_avindya
  card: summary

collections:
  notes:
    output: true
    permalink: /notes/:path/
  tools:
    output: true
    permalink: /tools/:path/

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
  - scope:
      path: ""
      type: tools
    values:
      layout: tool

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
