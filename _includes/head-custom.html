<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

{% assign p = site.data.person %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}/",
      "name": "{{ p.name }}",
      "publisher": { "@id": "{{ site.url }}/#person" },
      "inLanguage": "en"
    },
    {
      "@type": "ProfilePage",
      "@id": "{{ site.url }}/#profilepage",
      "url": "{{ site.url }}/",
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "mainEntity": { "@id": "{{ site.url }}/#person" }
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": "{{ p.name }}",
      "url": "{{ site.url }}/",
      "mainEntityOfPage": { "@id": "{{ site.url }}/#profilepage" },
      "jobTitle": "{{ p.job_title }}",
      "image": "{{ p.image }}",
      "description": {{ p.bio | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "{{ p.locality }}",
        "addressRegion": "{{ p.region }}",
        "addressCountry": "{{ p.country }}"
      },
      "nationality": { "@type": "Country", "name": "{{ p.country_name }}" },
      "knowsAbout": {{ p.knowsAbout | jsonify }},
      "knowsLanguage": [
        {% for lang in p.knowsLanguage %}{ "@type": "Language", "name": "{{ lang }}" }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ],
      "alumniOf": [
        {% for a in p.alumniOf %}{
          "@type": "{{ a.type }}",
          "name": "{{ a.name }}"{% if a.sameAs %},
          "sameAs": "{{ a.sameAs }}"{% endif %}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ],
      "hasCredential": [
        {% for c in p.hasCredential %}{
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "{{ c.category }}",
          "name": "{{ c.name }}",
          "recognizedBy": { "@type": "{{ c.recognizedByType }}", "name": "{{ c.recognizedBy }}" }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "{{ p.worksFor }}"
      },
      "sameAs": {{ p.sameAs | jsonify }}
    }
  ]
}
</script>
