{% assign p = site.data.person %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}/",
      "name": {{ site.title | jsonify }},
      "description": {{ site.description | strip_newlines | strip | jsonify }},
      "publisher": { "@id": "{{ site.url }}/#person" },
      "inLanguage": "en"
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": {{ p.name | jsonify }},
      "url": "{{ site.url }}/",
      "mainEntityOfPage": { "@id": "{{ site.url }}/about/#webpage" },
      "jobTitle": {{ p.job_title | jsonify }},
      "image": "{{ p.image }}",
      "description": {{ p.bio | strip_newlines | strip | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "addressLocality": {{ p.locality | jsonify }},
        "addressRegion": {{ p.region | jsonify }},
        "addressCountry": "{{ p.country }}"
      },
      "nationality": { "@type": "Country", "name": {{ p.country_name | jsonify }} },
      "knowsAbout": {{ p.knowsAbout | jsonify }},
      "knowsLanguage": [
        {% for lang in p.knowsLanguage %}{ "@type": "Language", "name": {{ lang | jsonify }} }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ],
      "alumniOf": [
        {% for a in p.alumniOf %}{
          "@type": "{{ a.type }}",
          "name": {{ a.name | jsonify }}{% if a.sameAs %},
          "sameAs": "{{ a.sameAs }}"{% endif %}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ],
      "hasCredential": [
        {% for c in p.hasCredential %}{
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": {{ c.category | jsonify }},
          "name": {{ c.name | jsonify }},
          "recognizedBy": { "@type": "{{ c.recognizedByType }}", "name": {{ c.recognizedBy | jsonify }} }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ],
      "worksFor": {
        "@type": "Organization",
        "name": {{ p.worksFor | jsonify }}
      },
      "sameAs": [
        {% for prof in p.profiles %}"{{ prof.url }}"{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }{% unless page.profile_page %},
    {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}#webpage",
      "url": "{{ page.url | absolute_url }}",
      "name": {{ page.title | default: site.title | jsonify }},
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "about": { "@id": "{{ site.url }}/#person" },
      "inLanguage": "en"
    }{% endunless %}
  ]
}
</script>
