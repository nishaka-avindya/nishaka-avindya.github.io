{% assign recs = site.data.recommendations %}
{% assign n_recs = recs | size %}
{% if n_recs > 0 %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {% for r in recs %}{
      "@type": "Quotation",
      "@id": "{{ site.url }}/about/#{{ r.id }}",
      "url": "{{ site.url }}/about/#{{ r.id }}",
      "text": {{ r.text | join: " " | jsonify }},
      "author": {
        "@type": "Person",
        "name": {{ r.name | jsonify }},
        "url": {{ r.url | jsonify }}{% if r.title %},
        "jobTitle": {{ r.title | jsonify }}{% endif %}{% if r.company %},
        "worksFor": { "@type": "Organization", "name": {{ r.company | jsonify }} }{% endif %}
      },
      "datePublished": {{ r.date | jsonify }},
      "about": { "@id": "{{ site.url }}/#person" },
      "isPartOf": { "@id": "{{ site.url }}/about/#webpage" },
      "inLanguage": "en"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
