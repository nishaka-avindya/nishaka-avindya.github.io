<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "TechArticle",
      "@id": "{{ page.url | absolute_url }}#article",
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | strip_newlines | strip | jsonify }},
      "url": "{{ page.url | absolute_url }}",
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      {% if page.last_modified_at %}"dateModified": "{{ page.last_modified_at | date_to_xmlschema }}",
      {% endif %}"author": { "@id": "{{ site.url }}/#person" },
      "publisher": { "@id": "{{ site.url }}/#person" },
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "mainEntityOfPage": { "@id": "{{ page.url | absolute_url }}#webpage" },
      "inLanguage": "en"
      {% if page.keywords %},"keywords": {{ page.keywords | jsonify }}{% endif %}
      {% if page.proficiency %},"proficiencyLevel": {{ page.proficiency | jsonify }}{% endif %}
      {% if page.syndication %},"sameAs": [
        {% for s in page.syndication %}"{{ s.href }}"{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]{% endif %}
    }{% if page.faq %},
    {
      "@type": "FAQPage",
      "@id": "{{ page.url | absolute_url }}#faq",
      "isPartOf": { "@id": "{{ page.url | absolute_url }}#webpage" },
      "mainEntity": [
        {% for f in page.faq %}{
          "@type": "Question",
          "name": {{ f.q | jsonify }},
          "acceptedAnswer": { "@type": "Answer", "text": {{ f.a | strip_newlines | strip | jsonify }} }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }{% endif %}{% if page.steps %},
    {
      "@type": "HowTo",
      "@id": "{{ page.url | absolute_url }}#howto",
      "name": {{ page.steps_title | default: page.title | jsonify }},
      "isPartOf": { "@id": "{{ page.url | absolute_url }}#webpage" },
      "step": [
        {% for st in page.steps %}{
          "@type": "HowToStep",
          "position": {{ forloop.index }},
          "name": {{ st.title | jsonify }},
          "text": {{ st.body | strip_newlines | strip | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }{% endif %}
  ]
}
</script>
