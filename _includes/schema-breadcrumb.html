{% unless page.sitemap == false or page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "@id": "{{ page.url | absolute_url }}#breadcrumb",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    }
    {% if page.url == "/guides/" %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Guides",
      "item": "{{ site.url }}/guides/"
    }
    {% elsif page.url == "/tools/" %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Tools",
      "item": "{{ site.url }}/tools/"
    }
    {% elsif page.layout == "guide" %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Guides",
      "item": "{{ site.url }}/guides/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
    {% elsif page.layout == "tool" %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Tools",
      "item": "{{ site.url }}/tools/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
    {% else %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
    {% endif %}
  ]
}
</script>
{% endunless %}
