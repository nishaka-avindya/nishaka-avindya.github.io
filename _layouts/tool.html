---
layout: default
---
<main id="main" class="page-main wrap">
  <a class="back-link" href="{{ '/tools/' | relative_url }}">{% include icon.html name="arrow-left" %} All tools</a>

  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}

  <div class="prose">
    {{ content }}
  </div>
</main>
{% if page.script %}<script src="{{ page.script | relative_url }}" defer></script>{% endif %}
