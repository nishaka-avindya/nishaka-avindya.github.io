---
layout: default
---
<main id="main" class="page-main wrap">
  {% include breadcrumb.html %}

  <h1>{{ page.title }}</h1>
  {% assign tool_lede = page.standfirst | default: page.description %}{% if tool_lede %}<p class="lede">{{ tool_lede }}</p>{% endif %}

  {{ content }}
</main>
{% if page.script %}<script src="{{ page.script | relative_url }}" defer></script>{% endif %}
